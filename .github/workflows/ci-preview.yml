name: CI + Docker Build

on:
  push:
    branches: [Selina, main]
  pull_request:
    branches: [Selina, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install -r requirements.txt
      - run: pytest

  # Builds the API image AND boots it -- a clean `docker build` does not
  # guarantee the container actually starts and serves traffic (e.g. a
  # broken CMD or a startup-time crash would build fine and only fail at
  # runtime), so this also curls /health against the running container.
  docker-api:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: survey-copilot-api:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot smoke test
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e LLM_PROVIDER=openai \
            -e LLM_MODEL="${{ vars.CI_LLM_MODEL || 'openai/gpt-oss-120b' }}" \
            -e LLM_API_KEY="${{ secrets.CI_LLM_API_KEY }}" \
            -e LLM_BASE_URL=https://api.groq.com/openai/v1 \
            survey-copilot-api:${{ github.sha }}
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "API never became healthy -- container logs:"
            docker logs api-smoke
            exit 1
          fi
          echo "API healthy"
      # Catches provider-side breakage that a plain health check can't see --
      # e.g. the LLM_MODEL value being deprecated/renamed upstream (this bit
      # us once: llama-3.3-70b-versatile silently stopped existing on Groq
      # and nothing caught it until someone tried the chat UI by hand).
      # CI_LLM_MODEL is a repo *variable* (not secret) precisely so bumping
      # the model after a provider catalog change doesn't need a code change.
      # Skips cleanly when CI_LLM_API_KEY isn't set (e.g. fork PRs, which
      # don't get repo secrets) rather than failing the whole job.
      - name: LLM roundtrip smoke test
        env:
          HAS_LLM_KEY: ${{ secrets.CI_LLM_API_KEY != '' }}
        run: |
          if [ "$HAS_LLM_KEY" != "true" ]; then
            echo "CI_LLM_API_KEY not set, skipping LLM roundtrip smoke test"
            exit 0
          fi
          body='{"message": "Reply with a single short sentence confirming you are working."}'
          resp=$(curl -sf -X POST http://localhost:8000/chat \
            -H "Content-Type: application/json" \
            -H "x-user-id: ci-llm-smoke" \
            --data-binary "$body")
          reply=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("reply") or "")')
          if [ -z "$reply" ]; then
            echo "LLM roundtrip failed -- full response:"
            echo "$resp"
            exit 1
          fi
          echo "LLM roundtrip OK, reply: $reply"
      - name: Stop container
        if: always()
        run: docker stop api-smoke 2>/dev/null || true

  # Build-only check for the frontend image -- it depends on the API being
  # reachable to do anything meaningful at runtime, so a full boot+integration
  # test isn't worth the CI complexity here; confirming it still builds in a
  # clean environment is the useful signal.
  docker-streamlit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.streamlit
          tags: survey-copilot-streamlit:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  r-bridge-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      # seminr's dependency tree (DiagrammeR/DiagrammeRsvg -> V8/curl/fs/...)
      # needs compiled system libraries -- same list the Dockerfile already
      # apt-get installs for the same reason, plus libuv1-dev which the
      # 'fs' package needs and psych/magrittr alone never required.
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libv8-dev libuv1-dev
      - run: Rscript -e 'options(repos="https://cloud.r-project.org"); install.packages(c("psych","magrittr","seminr"), dependencies=TRUE)'

      - name: EFA smoke test
        run: |
          Rscript r/efa_wrapper.R <(printf 'a,b\n1,2\n2,3\n') /tmp/efa_out.json 2
          test -f /tmp/efa_out.json

      # efa_wrapper.R alone never exercises seminr -- this project's "full
      # version" PLS-SEM path (HTMT/f-squared/Q2predict, see
      # PROFESSOR_REPORT.md 2.4) has broken on a seminr version bump before
      # (see DEVELOPMENT_LOG.md) with nothing in CI to catch it.
      - name: seminr smoke test
        run: |
          Rscript -e '
          set.seed(1)
          n <- 50
          fA <- rnorm(n)
          fB <- rnorm(n)
          df <- data.frame(
            A1 = fA + rnorm(n, sd = 0.3), A2 = fA + rnorm(n, sd = 0.3),
            B1 = fB + rnorm(n, sd = 0.3), B2 = fB + rnorm(n, sd = 0.3)
          )
          write.csv(df, "/tmp/seminr_smoke.csv", row.names = FALSE)
          '
          Rscript r/seminr_wrapper.R /tmp/seminr_smoke.csv /tmp/seminr_out.json \
            '{"measurement":{"A":["A1","A2"],"B":["B1","B2"]},"structural":{"B":["A"]}}' 50
          python3 -c '
          import json
          with open("/tmp/seminr_out.json") as f:
              d = json.load(f)
          if d.get("error"):
              raise SystemExit("seminr_wrapper.R reported an error: " + str(d["error"]))
          if not d.get("paths"):
              raise SystemExit("no structural paths in seminr output: " + str(d))
          print("seminr smoke OK, paths:", list(d["paths"].keys()))
          '
